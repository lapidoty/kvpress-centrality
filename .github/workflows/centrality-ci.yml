name: appendix-ci
on:
  push:
    branches: [centrality-appendix]
  pull_request:
jobs:
  additional-benchmarks-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch + kvpress + deps)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . || pip install transformers
          pip install pytest pandas
      - name: GraphKV comparison-benchmark tests
        run: python -m pytest -v additional_benchmarks/
